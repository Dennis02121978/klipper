################################################################################
# Display und Menue wie in der RF-Repetier-Firmware (RF2000 / RF2000 v2, 20x4)
# Einbinden in printer.cfg mit [include rf_display.cfg]
# Unter [display] dazu:
#   display_group: rf_splash   (Startbild, danach rf_page1)
#   menu_root: rf
#   menu_pages: rf_page1, rf_page_mod, rf_page2, rf_page3, rf_page4
#   menu_show_back: False
#   hd44780_charset: western
# Braucht den Klipper-Fork Dennis02121978/klipper (Umlaute, Seitenwechsel,
# SET_Z_SENSE_OFFSET). Ausserhalb des Menues blaettern hoch/runter die Seiten,
# zurueck springt auf Seite 1, OK oeffnet das Menue.
# Einstellungen aus dem Menue (DMS, Beschleunigung, Feedrate) werden wie im
# EEPROM in rf_variables.cfg gespeichert und beim Start geladen.
################################################################################

[save_variables]
filename: ~/printer_data/config/rf_variables.cfg

################################################################################
# Startbild beim Verbinden: 3D-Artmaker mit Version und Stand
# Unter [display] dazu: display_group: rf_splash
# Ablauf: Balken laeuft ca. 3 s, dann 3 s Version/Stand, dann Seite 1.
################################################################################

# Version und Stand der Config (bei einem neuen Release anpassen)
[gcode_macro _RF_INFO]
variable_version: "v1.4.0"
variable_stand: "07.11.2026"
gcode:
    {% set i = printer["gcode_macro _RF_INFO"] %}
    RESPOND MSG="3D-Artmaker {i.version}, Stand {i.stand}"

[gcode_macro _RF_SPLASH]
variable_step: 0
gcode:
    # Nur Variable fuer das Startbild

[delayed_gcode _RF_SPLASH_RUN]
initial_duration: 0.5
gcode:
    {% set s = printer["gcode_macro _RF_SPLASH"].step %}
    {% if s < 24 %}
    SET_GCODE_VARIABLE MACRO=_RF_SPLASH VARIABLE=step VALUE={s + 3 if s < 18 else s + 1}
    UPDATE_DELAYED_GCODE ID=_RF_SPLASH_RUN DURATION=0.5
    {% else %}
    SET_DISPLAY_GROUP GROUP=rf_page1
    {% endif %}

# Eigene Zeichen (5x8) nur fuer das Startbild. Die Plaetze werden beim
# Zeichnen belegt, die Seiten danach nutzen ihre eigenen Zeichen wieder.
# Isometrischer Wuerfel aus 2x2 Zeichen: Deckel als Umriss, links voll,
# rechts schraffiert
[display_glyph rf_cube_tl]
hd44780_slot: 1
hd44780_data:
  .....
  ....*
  ..**.
  **...
  ****.
  *****
  *****
  *****

[display_glyph rf_cube_tr]
hd44780_slot: 2
hd44780_data:
  .....
  *....
  .**..
  ...**
  .****
  *.*.*
  .*.**
  *.*.*

[display_glyph rf_cube_bl]
hd44780_slot: 3
hd44780_data:
  *****
  *****
  *****
  *****
  *****
  ..***
  ....*
  .....

[display_glyph rf_cube_br]
hd44780_slot: 4
hd44780_data:
  .*.**
  *.*.*
  .*.**
  *.*.*
  .*.**
  ***..
  *....
  .....

# Unterstrich unter dem Namen
[display_glyph rf_line]
hd44780_slot: 5
hd44780_data:
  *****
  .....
  .*.*.
  .....
  .....
  .....
  .....
  .....

# Fortschrittsbalken: voll und Spitze
[display_glyph rf_full]
hd44780_slot: 7
hd44780_data:
  *****
  *****
  *****
  *****
  *****
  *****
  *****
  *****

[display_glyph rf_shade]
hd44780_slot: 6
hd44780_data:
  *.*.*
  .*.*.
  *.*.*
  .*.*.
  *.*.*
  .*.*.
  *.*.*
  .*.*.

[display_data rf_splash title]
position: 0, 0
text: ~rf_cube_tl~~rf_cube_tr~  3D-Artmaker   ~rf_cube_tl~~rf_cube_tr~

[display_data rf_splash line]
position: 1, 0
text: ~rf_cube_bl~~rf_cube_br~  ~rf_line~~rf_line~~rf_line~~rf_line~~rf_line~~rf_line~~rf_line~~rf_line~~rf_line~~rf_line~~rf_line~   ~rf_cube_bl~~rf_cube_br~

[display_data rf_splash version]
position: 2, 0
text: { "{:^20}".format("Version " ~ printer["gcode_macro _RF_INFO"].version) }

[display_data rf_splash bar]
position: 3, 0
text:
  {% set s = printer["gcode_macro _RF_SPLASH"].step %}
  {% if s < 18 %}[{ "~rf_full~" * s }{ "~rf_shade~" }{ " " * (17 - s) }]{% else %}{ "{:^20}".format("Stand " ~ printer["gcode_macro _RF_INFO"].stand) }{% endif %}

################################################################################
# Startseiten (wie UI_PAGE4 in uimenu.h)
################################################################################

# Statuszeile: Meldung (M117) oder Zustand
[display_template _rf_status]
text:
  {% set ps = printer.print_stats.state %}
  {% if printer.display_status.message %}{ printer.display_status.message }
  {% elif ps == "printing" %}{ "Druck %3d%%" % (printer.display_status.progress * 100) }
  {% elif ps == "paused" %}Pause
  {% else %}Drucker bereit.{% endif %}

# Z-Zeile (Repetier "Z%hZ%x2%x5 %sC"): Z:<Position> <Ausgleich durch Mesh/Offset>
# Kmp = Kompensation (Bettnetz) aktiv; ? statt : = nicht referenziert
[display_template _rf_z]
text:
  {% set th = printer.toolhead %}{% set gz = printer.gcode_move.gcode_position.z %}
  { "Z%s%6.2f %6.2f%s" % (":" if "z" in th.homed_axes else "?", gz, th.position.z - gz, " Kmp" if printer.bed_mesh.profile_name else "") }

# Seite 1 (ui_page1): Temperaturen, Z, Kraft und Luefter, Status
[display_data rf_page1 temps]
position: 0, 0
text:
  {% set e = printer[printer.toolhead.extruder] %}{% set b = printer.heater_bed %}
  ~extruder~{ "%3.0f/%3.0f" % (e.temperature, e.target) }~degrees~{ " B%3.0f/%3.0f" % (b.temperature, b.target) }~degrees~

[display_data rf_page1 z]
position: 1, 0
text: { render("_rf_z")|trim }

[display_data rf_page1 force]
position: 2, 0
text: { "P: %5d L: %5.1f%%" % (printer["rf1000_load_cell_probe"].last_force, printer.fan.speed * 100) }

[display_data rf_page1 status]
position: 3, 0
text: { render("_rf_status")|trim }

# Seite 2 (ui_page_mod): Kraft und Geschwindigkeit, Z-Offset, Sense Offset, Z
[display_data rf_page_mod force]
position: 0, 0
text: { "P: %5d     V: %3d%%" % (printer["rf1000_load_cell_probe"].last_force, printer.gcode_move.speed_factor * 100) }

[display_data rf_page_mod zoffset]
position: 1, 0
text: { "zO:%5d um zMat: %s" % (printer.gcode_move.homing_origin.z * 1000, "An" if printer.bed_mesh.profile_name else "Aus") }

[display_data rf_page_mod sense]
position: 2, 0
text:
  {% set so = printer.z_sense_offset %}
  { "sO:%4d um " % (so.z_offset * 1000) }{ ("%s%5d" % ("@" if so.enabled else "^", so.force_threshold)) if so.enabled or so.z_offset > 0 else "Aus" }

[display_data rf_page_mod z]
position: 3, 0
text: { render("_rf_z")|trim }

# Seite 3 (ui_page2): Positionen und Vorschub
[display_data rf_page2 x]
position: 0, 0
text: { "X%s%7.2f mm" % (":" if "x" in printer.toolhead.homed_axes else "?", printer.gcode_move.gcode_position.x) }

[display_data rf_page2 y]
position: 1, 0
text: { "Y%s%7.2f mm" % (":" if "y" in printer.toolhead.homed_axes else "?", printer.gcode_move.gcode_position.y) }

[display_data rf_page2 z]
position: 2, 0
text: { render("_rf_z")|trim }

[display_data rf_page2 speed]
position: 3, 0
text: { "F:%3d %3d%% %5.1fmm/s" % (printer.gcode_move.speed / 60, printer.gcode_move.speed_factor * 100, printer.motion_report.live_velocity) }

# Seite 4 (ui_page3): Heizungen mit Leistung
[display_data rf_page3 e0]
position: 0, 0
text: { "E0:%3.0f/%3.0f" % (printer.extruder.temperature, printer.extruder.target) }~degrees~{ "C->%3d%%" % (printer.extruder.power * 100) }

[display_data rf_page3 e1]
position: 1, 0
text:
  {% if 'extruder1' in printer %}{ "E1:%3.0f/%3.0f" % (printer.extruder1.temperature, printer.extruder1.target) }~degrees~{ "C->%3d%%" % (printer.extruder1.power * 100) }{% endif %}

[display_data rf_page3 bed]
position: 2, 0
text: { "B: %3.0f/%3.0f" % (printer.heater_bed.temperature, printer.heater_bed.target) }~degrees~{ "C->%3d%%" % (printer.heater_bed.power * 100) }

[display_data rf_page3 status]
position: 3, 0
text: { render("_rf_status")|trim }

# Seite 5 (ui_page4): aktueller Druck
[display_data rf_page4 file]
position: 0, 0
text: { (printer.print_stats.filename or "Kein Druck")[:20] }

[display_data rf_page4 time]
position: 1, 0
text:
  {% set t = printer.print_stats.print_duration|int %}
  { "Druckzeit %3d:%02d:%02d" % (t // 3600, (t // 60) % 60, t % 60) }

[display_data rf_page4 filament]
position: 2, 0
text: { "Filament %8.2f m" % (printer.print_stats.filament_used / 1000) }

[display_data rf_page4 layer]
position: 3, 0
text:
  {% set i = printer.print_stats.info %}
  { "Layer %s/%s" % (i.current_layer if i.current_layer is not none else "-", i.total_layer if i.total_layer is not none else "-") }

################################################################################
# Menue (wie UI_MENU in uimenu.h, deutsche Texte aus uilang.h)
################################################################################

[menu rf]
type: list
name: Hauptmenü

# ---------------------------- Schnelleinstellung ----------------------------
[menu rf quick]
type: list
name: Schnelleinstellung

[menu rf quick stop]
type: list
enable: {printer.print_stats.state in ["printing", "paused"]}
name: Druck abbrechen

[menu rf quick stop yes]
type: command
name: Ja, abbrechen
gcode:
    CANCEL_PRINT
    {menu.exit()}

[menu rf quick stop no]
type: command
name: Nein
gcode: {menu.back()}

[menu rf quick home]
type: command
enable: {printer.print_stats.state not in ["printing", "paused"]}
name: Home alle
gcode: G28

[menu rf quick motors]
type: command
enable: {printer.print_stats.state not in ["printing", "paused"]}
name: Motoren ausschalten
gcode: M84

[menu rf quick output]
type: command
enable: {printer.print_stats.state not in ["printing", "paused"]}
name: Objekt ausgeben
gcode: _RF_OUTPUT_OBJECT

[menu rf quick speed]
type: input
name: Geschw. Mul.:{'%3d' % menu.input}%
input: {printer.gcode_move.speed_factor * 100}
input_min: 10
input_max: 300
input_step: 1
realtime: True
gcode: M220 S{menu.input|int}

[menu rf quick flow]
type: input
name: Fluss Mul.  :{'%3d' % menu.input}%
input: {printer.gcode_move.extrude_factor * 100}
input_min: 10
input_max: 200
input_step: 1
realtime: True
gcode: M221 S{menu.input|int}

[menu rf quick park]
type: command
enable: {printer.print_stats.state not in ["printing", "paused"]}
name: Heizbett parken
gcode: _RF_PARK

[menu rf quick light]
type: input
enable: {'led led' in printer}
name: X19 Licht: {'An' if menu.input else 'Aus'}
input: {1 if 'led led' in printer and printer["led led"].color_data[0][0:3]|sum > 0 else 0}
input_min: 0
input_max: 1
input_step: 1
realtime: True
gcode: SET_LED LED=led RED={menu.input|int} GREEN={menu.input|int} BLUE={menu.input|int}

[menu rf quick reset]
type: list
enable: {printer.print_stats.state not in ["printing", "paused"]}
name: Neustart

[menu rf quick reset yes]
type: command
name: Ja, neu starten
gcode: FIRMWARE_RESTART

[menu rf quick reset no]
type: command
name: Nein
gcode: {menu.back()}

# --------------------------------- Position ---------------------------------
[menu rf pos]
type: list
enable: {printer.print_stats.state not in ["printing", "paused"]}
name: Position

[menu rf pos home]
type: command
name: Home alle
gcode: G28

[menu rf pos homex]
type: command
name: Home X {'*' if 'x' in printer.toolhead.homed_axes else ''}
gcode: G28 X

[menu rf pos homey]
type: command
name: Home Y {'*' if 'y' in printer.toolhead.homed_axes else ''}
gcode: G28 Y

[menu rf pos homez]
type: command
name: Home Z {'*' if 'z' in printer.toolhead.homed_axes else ''}
gcode: G28 Z

[menu rf pos x]
type: input
enable: {'x' in printer.toolhead.homed_axes}
name: Position X:{'%7.1f' % menu.input}
input: {printer.gcode_move.gcode_position.x}
input_min: {printer.toolhead.axis_minimum.x}
input_max: {printer.toolhead.axis_maximum.x}
input_step: 1.0
realtime: True
gcode: _RF_MOVE AXIS=X POS={menu.input} F=3000

[menu rf pos y]
type: input
enable: {'y' in printer.toolhead.homed_axes}
name: Position Y:{'%7.1f' % menu.input}
input: {printer.gcode_move.gcode_position.y}
input_min: {printer.toolhead.axis_minimum.y}
input_max: {printer.toolhead.axis_maximum.y}
input_step: 1.0
realtime: True
gcode: _RF_MOVE AXIS=Y POS={menu.input} F=3000

[menu rf pos z]
type: input
enable: {'z' in printer.toolhead.homed_axes}
name: Position Z:{'%7.2f' % menu.input}
input: {printer.gcode_move.gcode_position.z}
input_min: 0
input_max: {printer.toolhead.axis_maximum.z - 1}
input_step: 0.1
realtime: True
gcode: _RF_MOVE AXIS=Z POS={menu.input} F=600

[menu rf pos e]
type: input
name: Position E:{'%+4.0f' % menu.input} mm
input: 0
input_min: -50
input_max: 50
input_step: 5
gcode:
    SAVE_GCODE_STATE NAME=_rf_e
    M83
    G1 E{menu.input} F240
    RESTORE_GCODE_STATE NAME=_rf_e

# ------------------------------ Pause Position ------------------------------
[menu rf pausepos]
type: list
enable: {printer.print_stats.state == "paused"}
name: Pause Position

[menu rf pausepos x]
type: input
name: Position X:{'%7.1f' % menu.input}
input: {printer.gcode_move.gcode_position.x}
input_min: {printer.toolhead.axis_minimum.x}
input_max: {printer.toolhead.axis_maximum.x}
input_step: 1.0
realtime: True
gcode: _RF_MOVE AXIS=X POS={menu.input} F=3000

[menu rf pausepos y]
type: input
name: Position Y:{'%7.1f' % menu.input}
input: {printer.gcode_move.gcode_position.y}
input_min: {printer.toolhead.axis_minimum.y}
input_max: {printer.toolhead.axis_maximum.y}
input_step: 1.0
realtime: True
gcode: _RF_MOVE AXIS=Y POS={menu.input} F=3000

[menu rf pausepos z]
type: input
name: Position Z:{'%7.2f' % menu.input}
input: {printer.gcode_move.gcode_position.z}
input_min: {printer.gcode_move.gcode_position.z}
input_max: {printer.toolhead.axis_maximum.z - 1}
input_step: 0.5
realtime: True
gcode: _RF_MOVE AXIS=Z POS={menu.input} F=600

# --------------------------------- Extruder ---------------------------------
[menu rf ext]
type: list
name: Extruder

[menu rf ext bed]
type: input
name: Temp. Bed:{'%3d' % menu.input}~degrees~C~extruder~{'%3.0f' % printer.heater_bed.temperature}
input: {printer.heater_bed.target}
input_min: 0
input_max: {printer.configfile.settings.heater_bed.max_temp - 10}
input_step: 5
gcode: M140 S{menu.input|int}

[menu rf ext t0]
type: input
name: Temp. E0 :{'%3d' % menu.input}~degrees~C~extruder~{'%3.0f' % printer.extruder.temperature}
input: {printer.extruder.target}
input_min: 0
input_max: {printer.configfile.settings.extruder.max_temp - 10}
input_step: 5
gcode: M104 T0 S{menu.input|int}

[menu rf ext t1]
type: input
enable: {'extruder1' in printer}
name: Temp. E1 :{'%3d' % menu.input}~degrees~C~extruder~{'%3.0f' % (printer.extruder1.temperature if 'extruder1' in printer else 0)}
input: {printer.extruder1.target if 'extruder1' in printer else 0}
input_min: 0
input_max: {printer.configfile.settings.extruder1.max_temp - 10 if 'extruder1' in printer else 250}
input_step: 5
gcode: M104 T1 S{menu.input|int}

[menu rf ext off0]
type: command
name: Extruder 0 aus
gcode: M104 T0 S0

[menu rf ext off1]
type: command
enable: {'extruder1' in printer}
name: Extruder 1 aus
gcode: M104 T1 S0

[menu rf ext offbed]
type: command
name: Heizbett aus
gcode: M140 S0

[menu rf ext active]
type: input
enable: {'extruder1' in printer and printer.print_stats.state not in ["printing", "paused"]}
name: Aktiver Extruder:{'%d' % menu.input}
input: {1 if printer.toolhead.extruder == "extruder1" else 0}
input_min: 0
input_max: 1
input_step: 1
gcode: T{menu.input|int}

[menu rf ext pla]
type: command
name: Vorheizen PLA
gcode: _RF_PREHEAT MATERIAL=PLA

[menu rf ext abs]
type: command
name: Vorheizen ABS
gcode: _RF_PREHEAT MATERIAL=ABS

[menu rf ext cool]
type: command
name: Abkühlen
gcode: _RF_COOLDOWN

[menu rf ext load]
type: command
enable: {printer.print_stats.state not in ["printing", "paused"]}
name: Filament laden
gcode: _RF_FILAMENT DIR=1

[menu rf ext unload]
type: command
enable: {printer.print_stats.state not in ["printing", "paused"]}
name: Filament entladen
gcode: _RF_FILAMENT DIR=-1

[menu rf ext flow]
type: input
name: Fluss Mul.  :{'%3d' % menu.input}%
input: {printer.gcode_move.extrude_factor * 100}
input_min: 10
input_max: 200
input_step: 1
realtime: True
gcode: M221 S{menu.input|int}

[menu rf ext eorigin]
type: command
enable: {printer.print_stats.state not in ["printing", "paused"]}
name: Setze E Ursprung
gcode: G92 E0

# ---------------------------------- Luefter ---------------------------------
[menu rf fan]
type: list
name: Lüfter

[menu rf fan speed]
type: input
name: Lüfter: {'%3d' % menu.input}%
input: {printer.fan.speed * 100}
input_min: 0
input_max: 100
input_step: 5
realtime: True
gcode: M106 S{(menu.input * 2.55)|int}

[menu rf fan off]
type: command
name: Lüfter aus
gcode: M107

[menu rf fan p25]
type: command
name: Lüfter auf  25%
gcode: M106 S64

[menu rf fan p50]
type: command
name: Lüfter auf  50%
gcode: M106 S128

[menu rf fan p75]
type: command
name: Lüfter auf  75%
gcode: M106 S191

[menu rf fan p100]
type: command
name: Lüfter auf 100%
gcode: M106 S255

# --------------------------------- SD Karte ---------------------------------
[menu rf sd]
type: list
name: SD Karte

[menu rf sd files]
type: vsdlist
enable: {printer.print_stats.state not in ["printing", "paused"]}
name: Drucke SD-Datei

[menu rf sd pause]
type: command
enable: {printer.print_stats.state == "printing"}
name: Druck pausieren
gcode: PAUSE

[menu rf sd resume]
type: command
enable: {printer.print_stats.state == "paused"}
name: Druck fortsetzen
gcode: RESUME

[menu rf sd stop]
type: list
enable: {printer.print_stats.state in ["printing", "paused"]}
name: Druck abbrechen

[menu rf sd stop yes]
type: command
name: Ja, abbrechen
gcode:
    CANCEL_PRINT
    {menu.exit()}

[menu rf sd stop no]
type: command
name: Nein
gcode: {menu.back()}

# ------------------------------- Konfiguration ------------------------------
[menu rf conf]
type: list
name: Konfiguration

# Z Kalibrierung
[menu rf conf z]
type: list
name: Z Kalibrierung

[menu rf conf z scan]
type: command
enable: {printer.print_stats.state not in ["printing", "paused"]}
name: Matrix Scan
gcode: _RF_MATRIX_SCAN

[menu rf conf z scanpla]
type: command
enable: {printer.print_stats.state not in ["printing", "paused"]}
name: Matrix Scan PLA
gcode: _RF_MATRIX_SCAN BED=60

[menu rf conf z scanabs]
type: command
enable: {printer.print_stats.state not in ["printing", "paused"]}
name: Matrix Scan ABS
gcode: _RF_MATRIX_SCAN BED=100

[menu rf conf z offsetscan]
type: command
enable: {printer.print_stats.state not in ["printing", "paused"]}
name: Z-Offset-Scan
gcode: _RF_Z_OFFSET_SCAN

[menu rf conf z offset]
type: input
name: Z Abstand:{'%7.3f' % menu.input}
input: {printer.gcode_move.homing_origin.z}
input_min: -2
input_max: 2
input_step: 0.01
realtime: True
gcode: SET_GCODE_OFFSET Z={'%.3f' % menu.input}

# DMS Features
[menu rf conf dms]
type: list
name: DMS Features

[menu rf conf dms sense]
type: list
name: SenseOffset

[menu rf conf dms sense level]
type: input
name: Level:{'%6d' % menu.input} digits
input: {printer.z_sense_offset.force_threshold}
input_min: 50
input_max: 20000
input_step: 50
gcode:
    SET_Z_SENSE_OFFSET FORCE_THRESHOLD={menu.input|int}
    SAVE_VARIABLE VARIABLE=rf_sense_threshold VALUE={menu.input|int}

[menu rf conf dms sense max]
type: input
name: Max: {'%3d' % menu.input} um
input: {printer.z_sense_offset.max_z_offset * 1000}
input_min: 0
input_max: 500
input_step: 10
gcode:
    SET_Z_SENSE_OFFSET MAX_Z_OFFSET={'%.3f' % (menu.input / 1000)}
    SAVE_VARIABLE VARIABLE=rf_sense_max VALUE={'%.3f' % (menu.input / 1000)}

[menu rf conf dms sense auto]
type: input
name: AutoStart: {'An' if menu.input else 'Aus'}
input: {printer.save_variables.variables.rf_sense_autostart|default(1)}
input_min: 0
input_max: 1
input_step: 1
gcode: SAVE_VARIABLE VARIABLE=rf_sense_autostart VALUE={menu.input|int}

[menu rf conf dms pause]
type: list
enable: {'rf1000_pressure_guard' in printer}
name: Notfall Pause

[menu rf conf dms pause min]
type: input
name: Min:{'%6d' % menu.input} digits
input: {printer.rf1000_pressure_guard.emergency_min}
input_min: -20000
input_max: 0
input_step: 100
gcode:
    RF_EMERGENCY_PAUSE MIN={menu.input|int}
    SAVE_VARIABLE VARIABLE=rf_pause_min VALUE={menu.input|int}

[menu rf conf dms pause max]
type: input
name: Max:{'%6d' % menu.input} digits
input: {printer.rf1000_pressure_guard.emergency_max}
input_min: 0
input_max: 20000
input_step: 100
gcode:
    RF_EMERGENCY_PAUSE MAX={menu.input|int}
    SAVE_VARIABLE VARIABLE=rf_pause_max VALUE={menu.input|int}

[menu rf conf dms flow]
type: list
enable: {'rf1000_pressure_guard' in printer}
name: Digit Flow CMP

[menu rf conf dms flow min]
type: input
name: Digit Min:{'%5d' % menu.input}
input: {printer.rf1000_pressure_guard.flow_min}
input_min: 0
input_max: 20000
input_step: 50
gcode:
    RF_FLOW_COMP MIN={menu.input|int}
    SAVE_VARIABLE VARIABLE=rf_flow_min VALUE={menu.input|int}

[menu rf conf dms flow max]
type: input
name: Digit Max:{'%5d' % menu.input}
input: {printer.rf1000_pressure_guard.flow_max}
input_min: 0
input_max: 20000
input_step: 50
gcode:
    RF_FLOW_COMP MAX={menu.input|int}
    SAVE_VARIABLE VARIABLE=rf_flow_max VALUE={menu.input|int}

[menu rf conf dms flow df]
type: input
name: dFlow:   :{'%+4d' % menu.input}%
input: {printer.rf1000_pressure_guard.flow_percent}
input_min: -99
input_max: 99
input_step: 1
gcode:
    RF_FLOW_COMP FLOW={menu.input|int}
    SAVE_VARIABLE VARIABLE=rf_flow_percent VALUE={menu.input|int}

[menu rf conf dms flow dv]
type: input
name: dFeed:   :{'%+4d' % menu.input}%
input: {printer.rf1000_pressure_guard.feed_percent}
input_min: -90
input_max: 99
input_step: 1
gcode:
    RF_FLOW_COMP FEED={menu.input|int}
    SAVE_VARIABLE VARIABLE=rf_feed_percent VALUE={menu.input|int}

# Temperaturen: PID-Autotune
[menu rf conf pid]
type: list
enable: {printer.print_stats.state not in ["printing", "paused"]}
name: Temperatures

[menu rf conf pid e0]
type: list
name: Extruder 0

[menu rf conf pid e0 yes]
type: command
name: PID starten
gcode:
    PID_TUNING_HOTEND_1
    {menu.exit()}

[menu rf conf pid e1]
type: list
enable: {'extruder1' in printer}
name: Extruder 1

[menu rf conf pid e1 yes]
type: command
name: PID starten
gcode:
    PID_TUNING_HOTEND_2
    {menu.exit()}

[menu rf conf pid bed]
type: list
name: Heizbett

[menu rf conf pid bed yes]
type: command
name: PID starten
gcode:
    PID_TUNING_BED
    {menu.exit()}

# Beschleunigung und Feedrate
[menu rf conf accel]
type: list
name: Beschleunigung

[menu rf conf accel xy]
type: input
name: Accel:{'%5d' % menu.input}
input: {printer.toolhead.max_accel}
input_min: 100
input_max: 10000
input_step: 100
gcode:
    SET_VELOCITY_LIMIT ACCEL={menu.input|int}
    SAVE_VARIABLE VARIABLE=rf_accel VALUE={menu.input|int}

[menu rf conf feed]
type: list
name: Feedrate

[menu rf conf feed max]
type: input
name: Max v:{'%4d' % menu.input}mm/s
input: {printer.toolhead.max_velocity}
input_min: 10
input_max: 500
input_step: 5
gcode:
    SET_VELOCITY_LIMIT VELOCITY={menu.input|int}
    SAVE_VARIABLE VARIABLE=rf_velocity VALUE={menu.input|int}

# Werkseinstellungen
[menu rf conf defaults]
type: list
enable: {printer.print_stats.state not in ["printing", "paused"]}
name: Werkseinstellungen

[menu rf conf defaults yes]
type: command
name: Ja, zurücksetzen
gcode:
    _RF_FACTORY_RESET
    {menu.exit()}

[menu rf conf defaults no]
type: command
name: Nein
gcode: {menu.back()}

################################################################################
# Hilfsmakros fuer das Menue
################################################################################

# Gespeicherte Menue-Einstellungen beim Start uebernehmen
[delayed_gcode _RF_LOAD_SETTINGS]
initial_duration: 1
gcode:
    {% set v = printer.save_variables.variables %}
    {% if 'rf_sense_threshold' in v or 'rf_sense_max' in v %}
    SET_Z_SENSE_OFFSET FORCE_THRESHOLD={v.rf_sense_threshold|default(printer.z_sense_offset.force_threshold)|int} MAX_Z_OFFSET={v.rf_sense_max|default(printer.z_sense_offset.max_z_offset)}
    {% endif %}
    {% if 'rf1000_pressure_guard' in printer %}
    {% set pg = printer.rf1000_pressure_guard %}
    {% if 'rf_pause_min' in v or 'rf_pause_max' in v %}
    RF_EMERGENCY_PAUSE MIN={v.rf_pause_min|default(pg.emergency_min)} MAX={v.rf_pause_max|default(pg.emergency_max)}
    {% endif %}
    {% if 'rf_flow_min' in v or 'rf_flow_max' in v or 'rf_flow_percent' in v or 'rf_feed_percent' in v %}
    RF_FLOW_COMP MIN={v.rf_flow_min|default(pg.flow_min)} MAX={v.rf_flow_max|default(pg.flow_max)} FLOW={v.rf_flow_percent|default(pg.flow_percent)} FEED={v.rf_feed_percent|default(pg.feed_percent)}
    {% endif %}
    {% endif %}
    {% if 'rf_accel' in v %}
    SET_VELOCITY_LIMIT ACCEL={v.rf_accel}
    {% endif %}
    {% if 'rf_velocity' in v %}
    SET_VELOCITY_LIMIT VELOCITY={v.rf_velocity}
    {% endif %}

# Werte aus der printer.cfg wiederherstellen und speichern
[gcode_macro _RF_FACTORY_RESET]
gcode:
    {% set c = printer.configfile.settings %}
    SET_Z_SENSE_OFFSET FORCE_THRESHOLD={c.z_sense_offset.force_threshold} MAX_Z_OFFSET={c.z_sense_offset.max_z_offset}
    SAVE_VARIABLE VARIABLE=rf_sense_threshold VALUE={c.z_sense_offset.force_threshold}
    SAVE_VARIABLE VARIABLE=rf_sense_max VALUE={c.z_sense_offset.max_z_offset}
    SAVE_VARIABLE VARIABLE=rf_sense_autostart VALUE=1
    {% if 'rf1000_pressure_guard' in c %}
    {% set g = c.rf1000_pressure_guard %}
    RF_EMERGENCY_PAUSE MIN={g.emergency_min} MAX={g.emergency_max}
    RF_FLOW_COMP MIN={g.flow_min} MAX={g.flow_max} FLOW={g.flow_percent} FEED={g.feed_percent}
    SAVE_VARIABLE VARIABLE=rf_pause_min VALUE={g.emergency_min}
    SAVE_VARIABLE VARIABLE=rf_pause_max VALUE={g.emergency_max}
    SAVE_VARIABLE VARIABLE=rf_flow_min VALUE={g.flow_min}
    SAVE_VARIABLE VARIABLE=rf_flow_max VALUE={g.flow_max}
    SAVE_VARIABLE VARIABLE=rf_flow_percent VALUE={g.flow_percent}
    SAVE_VARIABLE VARIABLE=rf_feed_percent VALUE={g.feed_percent}
    {% endif %}
    SET_VELOCITY_LIMIT ACCEL={c.printer.max_accel} VELOCITY={c.printer.max_velocity}
    SAVE_VARIABLE VARIABLE=rf_accel VALUE={c.printer.max_accel}
    SAVE_VARIABLE VARIABLE=rf_velocity VALUE={c.printer.max_velocity}
    M117 Werkseinstellungen

# Achse absolut fahren (fuer die Positionsmenues)
[gcode_macro _RF_MOVE]
gcode:
    SAVE_GCODE_STATE NAME=_rf_move
    G90
    G1 {params.AXIS}{params.POS} F{params.F|default(3000)}
    RESTORE_GCODE_STATE NAME=_rf_move

# Objekt ausgeben (Repetier OUTPUT_OBJECT_SCRIPT_PRINT): zurueckziehen, Bett ganz
# nach unten und nach vorne, Motoren aus
[gcode_macro _RF_OUTPUT_OBJECT]
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
    RESPOND TYPE=error MSG="Objekt ausgeben: Zuerst alle Achsen referenzieren."
    {% else %}
    {% set th = printer.toolhead %}
    {% if printer[th.extruder].temperature >= printer.configfile.settings[th.extruder].min_extrude_temp %}
    M83
    G1 E-1 F1800
    {% endif %}
    G90
    G1 Z{th.axis_maximum.z - 1} F540
    G1 Y{th.axis_maximum.y} F4800
    M400
    M84
    M117 Objekt ausgegeben
    {% endif %}

# Heizbett parken (Repetier PARK_POSITION X0 Y120 Z175)
[gcode_macro _RF_PARK]
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
    G28
    {% endif %}
    G90
    G1 Z{[175, printer.toolhead.axis_maximum.z - 1]|min} F600
    G1 X0 Y120 F4800
    M117 Heizbett geparkt

# Vorheizen wie Repetier (PLA 180/60, ABS 210/100) fuer den aktiven Extruder
[gcode_macro _RF_PREHEAT]
gcode:
    {% if params.MATERIAL|default("PLA")|upper == "ABS" %}
    {% set e, b = 210, 100 %}
    {% else %}
    {% set e, b = 180, 60 %}
    {% endif %}
    M104 S{e}
    M140 S{b}

[gcode_macro _RF_COOLDOWN]
gcode:
    TURN_OFF_HEATERS
    M107

# Filament laden/entladen wie Repetier "Durchdruecken"/"Oldstyle pull":
# laden bei 210 Grad 90 mm langsam, entladen bei 180 Grad 90 mm zurueck.
# In zwei Schritten, weil max_extrude_only_distance 50 mm ist.
[gcode_macro _RF_FILAMENT]
gcode:
    {% set dir = params.DIR|default(1)|int %}
    {% set temp = 210 if dir > 0 else 180 %}
    {% set feed = 100 if dir > 0 else 500 %}
    M117 Heize auf {temp}...
    M109 S{temp}
    SAVE_GCODE_STATE NAME=_rf_fil
    M83
    G1 E{45 * dir} F{feed}
    G1 E{45 * dir} F{feed}
    RESTORE_GCODE_STATE NAME=_rf_fil
    M104 S0
    M117 Filament {'geladen' if dir > 0 else 'entladen'}

# Matrix Scan: referenzieren, optional Bett heizen, dann BED_CALIBRATE
# (misst Z, erstellt das Bettnetz und speichert mit SAVE_CONFIG)
[gcode_macro _RF_MATRIX_SCAN]
gcode:
    {% if params.BED is defined %}
    M117 Heize Bett auf {params.BED}...
    M190 S{params.BED|int}
    {% endif %}
    {% if printer.toolhead.homed_axes != "xyz" %}
    G28
    {% endif %}
    M117 Matrix Scan...
    BED_CALIBRATE

# Z-Offset-Scan in der Bettmitte
[gcode_macro _RF_Z_OFFSET_SCAN]
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
    G28
    {% endif %}
    G90
    G0 Z10 F600
    G0 X100 Y100 F4800
    G0 Z2 F600
    M117 Z-Offset-Scan...
    Z_OFFSET_SCAN
