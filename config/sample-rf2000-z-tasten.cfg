# Z-Tasten am RF2000
# Z_DOWN erhoeht Z, Z_UP verringert Z (wie die bisherige Belegung).
# Kurz druecken: 0,03 mm. Nach 2 Sekunden Halten: 3 mm/s bis zum Loslassen.
# Waehrend eines Drucks: Babystep um 0,005 mm, Halten faehrt nicht.
# Ohne Z-Referenzfahrt tun die Tasten nichts.
# Beim Halten stoppt die Fahrt in Richtung kleineres Z bei hold_min_z,
# die kurzen Schritte erst bei position_min.

[z_jog]
increase_pin: !PJ4
decrease_pin: !PJ2
hold_delay: 2.0
hold_speed: 8.0
hold_min_z: 0.0
max_margin: 0.5
press_gcode:
    _Z_JOG_START DIR={params.DIR}

[gcode_macro _Z_JOG]
variable_step: 0.03
variable_step_speed: 3.0
variable_babystep: 0.005
variable_max_margin: 0.5
gcode:
    # Nur Variablen

[gcode_macro _Z_JOG_START]
gcode:
    {% set jog = printer["gcode_macro _Z_JOG"] %}
    {% set dir = params.DIR|int %}
    {% if printer.print_stats.state == "printing" %}
        SET_GCODE_OFFSET Z_ADJUST={jog.babystep * dir}
    {% elif "z" not in printer.toolhead.homed_axes %}
        RESPOND TYPE=error MSG="Z-Tasten: Zuerst die Z-Achse referenzieren."
    {% else %}
        {% set z = printer.toolhead.position.z %}
        {% set low = printer.toolhead.axis_minimum.z %}
        {% set high = printer.toolhead.axis_maximum.z - jog.max_margin %}
        {% set target = [[z + jog.step * dir, low]|max, high]|min %}
        {% set dist = target - z %}
        {% if dist * dir > 0 %}
            SAVE_GCODE_STATE NAME=_z_jog
            G91
            G1 Z{"%.4f" % dist} F{jog.step_speed * 60}
            RESTORE_GCODE_STATE NAME=_z_jog
        {% endif %}
    {% endif %}
